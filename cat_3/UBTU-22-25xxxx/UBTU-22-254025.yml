---

{{ if .Vars.ubtu22stig_cat3 }}
  {{ if .Vars.ubtu22stig_254025 }}
command:
  ssd_offline_creds:
    title: UBTU-22-254025 | Ubuntu 22.04 LTS must be configured such that Pluggable Authentication Module (PAM) prohibits the use of cached authentications after one day.
    exec: grep offline_credentials_expiration /etc/sssd/sssd.conf /etc/sssd/conf.d/*.conf
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^offline_credentials_expiration = 1/'
    - '!/^offline_credentials_expiration = (0|2-9)/'
    meta:
      Cat: 3
      CCI: CCI-002007
      Group_Title: SRG-OS-000359-GPOS-00146
      NIST800-53R4: IA-5
      Rule_ID: SV-274863r1107271_rule
      STIG_ID: UBTU-22-254025
      Vul_ID: V-274863
  {{ end }}
{{ end }}
