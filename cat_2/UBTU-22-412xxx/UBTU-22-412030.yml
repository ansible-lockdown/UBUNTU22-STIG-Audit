---

{{ if .Vars.ubtu22stig_cat2 }}
  {{ if .Vars.ubtu22stig_412030 }}
command:
  TMOUT_setting:
    title: UBTU-22-412030 | Ubuntu 22.04 LTS must automatically exit interactive command shell user sessions after 15 minutes of inactivity.
    exec: grep -E "\bTMOUT=[0-9]+" /etc/bash.bashrc /etc/profile.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^[^:]+:\s*(export\s+|readonly\s+|declare\s+-[a-z]*\s+)*TMOUT=([1-9][0-9]?|[1-8][0-9]{2}|900)\b/'
    - '!/^[^:]+:\s*(export\s+|readonly\s+|declare\s+-[a-z]*\s+)*TMOUT=(0+|90[1-9]|9[1-9][0-9]|[1-9][0-9]{3,})\b/'
    meta:
      Cat: 2
      CCI:
      - CCI-002361
      Group_Title:
      - SRG-OS-000279-GPOS-00109
      NIST800-53R4: AC-12
      Rule_ID: SV-260554r958636_rule
      STIG_ID: UBTU-22-412030
      Vul_ID: V-260554
  {{ end }}
{{ end }}
