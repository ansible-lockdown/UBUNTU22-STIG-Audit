---

{{ if .Vars.ubtu22stig_cat2 }}
  {{ if .Vars.ubtu22stig_271025 }}
command:
  gsettings_lock_inactivity:
    title: UBTU-22-271025 | Ubuntu 22.04 LTS must initiate a graphical session lock after 10 minutes of inactivity.
    exec: echo "lock-enabled $(gsettings get org.gnome.desktop.screensaver lock-enabled)"; echo "lock-delay $(gsettings get org.gnome.desktop.screensaver lock-delay)"; echo "idle-delay $(gsettings get org.gnome.desktop.session idle-delay)"
    exit-status: 0
    stdout:
    - '/^lock-enabled true$/'
    - '/^lock-delay uint32 0$/'
    - '/^idle-delay uint32 ([1-9][0-9]?|[1-5][0-9]{2}|600)$/'
    meta:
      Cat: 2
      CCI:
      - CCI-000057
      Group_Title:
      - SRG-OS-000029-GPOS-00010
      NIST800-53R4:
      - AC-11
      Rule_ID: SV-260538r1208695_rule
      STIG_ID: UBTU-22-271025
      Vul_ID: V-260538
  {{ end }}
{{ end }}
