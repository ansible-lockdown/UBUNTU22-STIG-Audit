---

{{ if .Vars.ubtu22stig_cat2 }}
  {{ if .Vars.ubtu22stig_612025 }}
command:
  ocsp_on_pki_required:
    title: UBTU-22-612025 | Ubuntu 22.04 LTS must electronically verify personal identity verification (PIV) credentials.
    exec: >-
      awk '/pkcs11_module opensc {/,/}/' /etc/pam_pkcs11/pam_pkcs11.conf | grep -E '^\s*cert_policy\s*=' | awk '{ print ($0 ~ /=[ \t]*([^;#]*,)?[ \t]*ocsp_on[ \t]*(,|;)/ ? "ocsp_on_present " : "ocsp_on_missing ") $0 }'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^ocsp_on_present /'
    - '!/^ocsp_on_missing /'
    meta:
      Cat: 2
      CCI:
      - CCI-001954
      Group_Title:
      - SRG-OS-000377-GPOS-00162
      NIST800-53R4: IA-2
      Rule_ID: SV-260576r1268244_rule
      STIG_ID: UBTU-22-612025
      Vul_ID: V-260576
  {{ end }}
{{ end }}
