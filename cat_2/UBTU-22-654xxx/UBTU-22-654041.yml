---

{{ if .Vars.ubtu22stig_cat2 }}
  {{ if .Vars.ubtu22stig_654041 }}
command:
  cronjobs_module_cnf:
    title: UBTU-22-654041 | Ubuntu 22.04 LTS must audit any script or executable called by cron as root or by any privileged user. | Config
    exec: grep cronjobs /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/(.*:|)-w /etc/cron.d/ -p wa -k cronjobs/'
    - '/(.*:|)-w /var/spool/cron/ -p wa -k cronjobs/'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title: SRG-OS-000396-GPOS-00176
      NIST800-53R4: AU-12
      Rule_ID: SV-260610r958446_rule
      STIG_ID: UBTU-22-654041
      Vul_ID: V-260610
  cronjobs_module_live:
    title: UBTU-22-654041 | Ubuntu 22.04 LTS must audit any script or executable called by cron as root or by any privileged user. | Live
    exec: auditctl -l | grep cronjobs
    exit-status: 0
    stdout:
    - '-w /etc/cron.d -p wa -k cronjobs'
    - '-w /var/spool/cron -p wa -k cronjobs'
    meta:
      Cat: 2
      CCI:
      - CCI-000172
      Group_Title: SRG-OS-000396-GPOS-00176
      NIST800-53R4: AU-12
      Rule_ID: SV-260610r958446_rule
      STIG_ID: UBTU-22-654041
      Vul_ID: V-260610
  {{ end }}
{{ end }}
