    exec: grep -Ei 'nopasswd' /etc/sudoers /etc/sudoers.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/^.*/'
    meta:
      Cat: 2
      CCI: CCI-002038
      Group_Title: SRG-OS-000396-GPOS-00176
      NIST800-53R4: IA-11
      Rule_ID: SV-274860r1155210_rule
      STIG_ID: UBTU-22-432011
      Vul_ID: V-274860
  {{ end }}
